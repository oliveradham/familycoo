name: EAS Build & Submit iOS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
      submit:
        description: "Submit to App Store after build?"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build iOS (production)
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait

      - name: Submit to App Store
        if: ${{ github.event.inputs.submit == 'true' }}
        run: eas submit --platform ios --latest --non-interactive
