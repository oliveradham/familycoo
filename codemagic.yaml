workflows:
  ios-capacitor:
    name: iOS Capacitor Build & Submit
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FamilyCOO_ASC
    environment:
      vars:
        APP_STORE_APPLE_ID: 6790180298
        BUNDLE_ID: com.familycoo.ios
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install
      - name: Build web assets
        script: bun run build
      - name: Prepare Capacitor web assets
        script: |
          set -e
          rm -rf www

          # Try common output locations for Vite / TanStack Start / Nitro
          CANDIDATES=(
            "dist"
            "dist/client"
            ".output/public"
            "build/client"
            ".vinxi/build/client"
            ".nitro/output/public"
            ".output/client"
          )

          FOUND=""
          for dir in "${CANDIDATES[@]}"; do
            if [ -f "$dir/index.html" ]; then
              FOUND="$dir"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "Could not find built web assets. Searching for any index.html..."
            find . -name "index.html" -not -path "./node_modules/*" -not -path "./ios/*" 2>/dev/null | head -20
            echo "--- Top-level dirs ---"
            ls -la
            echo "--- .output tree (if exists) ---"
            [ -d .output ] && find .output -maxdepth 3 -type d
            exit 1
          fi

          echo "Using web assets from: $FOUND"
          cp -R "$FOUND" www
          test -f www/index.html

      - name: Add iOS platform (first run only)
        script: |
          set -e
          if [ ! -d "ios" ]; then
            npx --yes @capacitor/cli add ios
          fi
          npx --yes @capacitor/cli sync ios
      - name: Set up signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
