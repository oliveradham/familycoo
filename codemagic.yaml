workflows:
  ios-capacitor:
    name: iOS Capacitor Build & Submit
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FamilyCOO_ASC
    environment:
      vars:
        APP_STORE_APPLE_ID: 6790180298
        BUNDLE_ID: com.familycoo.ios
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install -g bun
          bun install
      - name: Build web assets
        script: bun run build
      - name: Prepare Capacitor web assets
        script: |
          set -e
          rm -rf www

          # TanStack Start is server-rendered, so it does not produce a static
          # index.html for Capacitor. The native shell loads the published app
          # URL from capacitor.config.ts; this local file only satisfies the
          # Capacitor/Xcode packaging requirement.
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Family COO</title>
            </head>
            <body>
              <script>window.location.replace('https://familycoo.lovable.app');</script>
            </body>
          </html>
          EOF
          test -f www/index.html

      - name: Add iOS platform
        script: |
          set -e
          rm -rf ios
          npx --yes @capacitor/cli add ios
          npx --yes @capacitor/cli sync ios
          echo "--- ios/App contents ---"
          ls -la ios/App || true
          test -d "$XCODE_PROJECT"
      - name: Set up signing files
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          echo "--- downloaded provisioning profiles ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=36WRN4SN65"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
